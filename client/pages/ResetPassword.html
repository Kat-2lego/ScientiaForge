<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 48px;
            height: 48px;
            background: #eff6ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .icon svg {
            width: 22px;
            height: 22px;
            stroke: #3b82f6;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #111;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 11px 40px 11px 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            color: #111;
            outline: none;
            transition: border-color 0.2s;
            background: #fafafa;
        }

        input:focus {
            border-color: #3b82f6;
            background: #fff;
        }

        input.error-input {
            border-color: #ef4444;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #9ca3af;
            background: none;
            border: none;
            padding: 0;
            display: flex;
            align-items: center;
        }

        .toggle-password:hover {
            color: #6b7280;
        }

        .toggle-password svg {
            width: 18px;
            height: 18px;
        }

        .error-msg {
            font-size: 12px;
            color: #ef4444;
            margin-top: 5px;
            display: none;
        }

        .error-msg.visible {
            display: block;
        }

        /* Password strength */
        .strength-bar {
            display: flex;
            gap: 4px;
            margin-top: 8px;
        }

        .strength-bar span {
            height: 4px;
            flex: 1;
            border-radius: 4px;
            background: #e5e7eb;
            transition: background 0.3s;
        }

        .strength-label {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 4px;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 8px;
            padding: 12px;
            background: #3b82f6;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }

        button[type="submit"]:hover:not(:disabled) {
            background: #2563eb;
        }

        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .success-box {
            display: none;
            background: #f0fdf4;
            border: 1.5px solid #bbf7d0;
            border-radius: 8px;
            padding: 14px 16px;
            margin-top: 18px;
            font-size: 13px;
            color: #166534;
            line-height: 1.5;
        }

        .success-box.visible {
            display: block;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #6b7280;
            text-decoration: none;
        }

        .back-link span {
            color: #3b82f6;
            font-weight: 600;
            cursor: pointer;
        }

        .back-link span:hover {
            text-decoration: underline;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M13.5 10.5V6.75a4.5 4.5 0 1 1 9 0v3.75M3.75 21.75h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H3.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
            </svg>
        </div>

        <h1>Reset your password</h1>
        <p class="subtitle">Choose a new password for your account. Make sure it's at least 8 characters.</p>

        <div class="field">
            <label for="new-password">New password</label>
            <div class="input-wrapper">
                <input type="password" id="new-password" placeholder="Enter new password" />
                <button class="toggle-password" type="button" onclick="toggleVisibility('new-password', this)">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>
                </button>
            </div>
            <div class="strength-bar">
                <span id="bar1"></span>
                <span id="bar2"></span>
                <span id="bar3"></span>
                <span id="bar4"></span>
            </div>
            <p class="strength-label" id="strength-label"></p>
            <p class="error-msg" id="password-error">Password must be at least 8 characters.</p>
        </div>

        <div class="field">
            <label for="confirm-password">Confirm password</label>
            <div class="input-wrapper">
                <input type="password" id="confirm-password" placeholder="Re-enter new password" />
                <button class="toggle-password" type="button" onclick="toggleVisibility('confirm-password', this)">
                    <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                    </svg>
                </button>
            </div>
            <p class="error-msg" id="confirm-error">Passwords do not match.</p>
        </div>

        <button type="submit" id="submit-btn">Reset password</button>

        <div class="success-box" id="success-box">
            ✅ Password reset successful. You can now <a href="../pages/LogIn.html" style="color:#166534; font-weight:600;">log in</a> with your new password.
        </div>

        <a class="back-link" href="../pages/LogIn.html"><span>← Back to login</span></a>
    </div>

    <script src="../js/ResetPassword.js"></script>

</body>
</html>
