<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f5f5f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 48px;
            height: 48px;
            background: #eff6ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .icon svg {
            width: 22px;
            height: 22px;
            stroke: #3b82f6;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #111;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        input[type="email"] {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            color: #111;
            outline: none;
            transition: border-color 0.2s;
            background: #fafafa;
        }

        input[type="email"]:focus {
            border-color: #3b82f6;
            background: #fff;
        }

        input[type="email"].error-input {
            border-color: #ef4444;
        }

        .error-msg {
            font-size: 12px;
            color: #ef4444;
            margin-top: 5px;
            display: none;
        }

        .error-msg.visible {
            display: block;
        }

        button[type="submit"] {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #3b82f6;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }

        button[type="submit"]:hover:not(:disabled) {
            background: #2563eb;
        }

        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .success-box {
            display: none;
            background: #f0fdf4;
            border: 1.5px solid #bbf7d0;
            border-radius: 8px;
            padding: 14px 16px;
            margin-top: 18px;
            font-size: 13px;
            color: #166534;
            line-height: 1.5;
        }

        .success-box.visible {
            display: block;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #6b7280;
            text-decoration: none;
        }

        .back-link span {
            color: #3b82f6;
            font-weight: 600;
            cursor: pointer;
        }

        .back-link span:hover {
            text-decoration: underline;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
      <link rel="stylesheet" href="../css/theme.css" />
  <script src="../js/theme.js"></script>
</head>
<body>

    <div class="card">
        <div class="icon">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
            </svg>
        </div>

        <h1>Forgot your password?</h1>
        <p class="subtitle">Enter your email address and we'll send you a link to reset your password.</p>

        <div>
            <label for="email">Email address</label>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
            <p class="error-msg" id="error-msg">Please enter a valid email address.</p>
        </div>

        <button type="submit" id="submit-btn" onclick="handleSubmit()">
            Send reset link
        </button>

        <div class="success-box" id="success-box">
            ✅ If that email is registered, a reset link has been sent. Check your inbox (and spam folder).
        </div>

        <a class="back-link" href="../pages/LogIn.html"><span>← Back to login</span></a>
    </div>

    <script src="../js/ForgotPassword.js"></script>
</body>
</html>
