<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillForge Login</title>
    <link rel="stylesheet" href="../css/LogIn.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="master-viewport">
        <div class="chassis-outer-shell">
            <div class="chassis-inner-recess">
                
                <main class="interface-deck">
                    
                    <section class="sector sector-left">
                        <div class="dot-matrix-wave wave-alpha"></div>
                        <div class="dot-matrix-wave wave-beta"></div>

                        <div class="auth-container">
                            <div class="brand-header">
                                <div class="logo-icon">
                                   
                                        <img src="../assets/handshake.png" alt="Collaborative Handshake" class="handshake-img">
                    
                                </div>
                                <h1 class="brand-name">Skill <span>Forge</span></h1>
                            </div>

                            <div class="auth-titles">
                                <h2>SIGN IN</h2>
                                <p>Welcome back! Enter your login details.</p>
                            </div>


                            <div class = "email">
                            <p>Email: </p>
                            </div>



                            <form class="cyber-form">
                                <div class="input-module">
                                    <div class="module-bezel">
                                        <div class="module-inner">
                                            <i class="fa-regular fa-address-card module-icon"></i>
                                            <input type="text" placeholder="Enter Email" required>
                                        </div>
                                    </div>
                                    <div class="neon-line"></div>
                                </div>

                            <div class = "pass">
                            <p>Password: </p>
                            </div>

                                <div class="input-module">
                                    <div class="module-bezel">
                                        <div class="module-inner">
                                            <i class="fa-solid fa-lock module-icon"></i>
                                            <input type="password" placeholder="••••" required>
                                            <i class="fa-regular fa-eye-slash module-action"></i>
                                        </div>
                                    </div>
                                    <div class="neon-line"></div>
                                </div>

                                <div class="form-footer-links">
                                    <a href="#" class="link-forgot">Forgot Password?</a>
                                </div>

                                <button type="submit" class="secure-submit">
                                    <span class="btn-inner-text">Login</span>
                                    <div class="btn-lighting-overlay"></div>
                                </button>
                            </form>
                        </div>
                    </section>

                    <div class="kinetic-divider">
                        <div class="divider-beam"></div>
                        <div class="divider-glow-core"></div>
                    </div>

                    <section class="sector sector-right">
                        <div class="dot-matrix-wave wave-gamma"></div>
                        <div class="dot-matrix-wave wave-delta"></div>

                        <div class="welcome-copy">
                            <h3>Welcome back!<br>Please sign in to your<br><span class="navy">Skill</span><span class="cyan">Forge</span> account.</h3>
                            <p class="tagline">Forge Your Future. Master Your Career.</p>
                        </div>

                        <div class="visual-stage">
                            <img src="../assets/handshake1.png" alt="Collaborative Handshake" class="handshake-img">
                        </div>
                    </section>

                </main>
            </div>
        </div>

        <footer class="global-footer">
            © 2026 SkillForge AI - ScriptSquad SECURE LOGIN ACCESS
        </footer>
    </div>

</body>
</html>>
