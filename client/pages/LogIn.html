<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillForge Login</title>
    <link rel="stylesheet" href="../css/SignUp.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="../auth/loginUser.js" defer></script>
</head>
<body>

    <div class="master-viewport">
        <div class="chassis-outer-shell">
            <div class="chassis-inner-recess">
                
                <main class="interface-deck">
                    
                    <section class="sector sector-left">
                        <div class="brand-header">
                            <h1 class="brand-name">Skill<span>Forge</span></h1>
                        </div>

                        <div class="auth-titles" style="margin-top: 15px; margin-bottom: 30px;">
                            <h2>Welcome back</h2>
                            <p>Continue To "Forge Your Future. Master Your Career."</p>
                        </div>

                        <form class="cyber-form" id="loginForm" onsubmit="event.preventDefault(); handleSignIn();">
                            
                            <div class="field-wrapper email" style="width: 100%;">
                                <p>Email Address:</p>
                                <input 
                                    type="email" 
                                    id="sf-email" 
                                    placeholder="name@company.com" 
                                    class="input" 
                                    required 
                                />
                            </div>

                            <div class="field-wrapper pass" style="position: relative; margin-bottom: 12px;">
                                <p>Password:</p>
                                <input 
                                    type="password" 
                                    id="sf-pass" 
                                    placeholder="••••••••" 
                                    class="input" 
                                    required 
                                />
                                <button 
                                    type="button" 
                                    id="sf-eye-icon-btn" 
                                    onclick="togglePw()" 
                                    style="position: absolute; right: 16px; bottom: 12px; background: none; border: none; cursor: pointer; color: #64748b;"
                                >
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>

                            <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 25px; padding: 0 4px;">
                                <label class="checkbox-lbl-item" style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                    <input type="checkbox" id="sf-remember" style="cursor: pointer;">
                                    <span style="font-size: 13px; color: #475569; font-weight: 600;">Remember me</span>
                                </label>
                                <a href="ForgotPassword.html" class="link-forgot" style="font-size: 13px; color: #058c95; text-decoration: none; font-weight: 700;">Forgot Password?</a>
                            </div>

                            <div class="field-wrapper" style="width: 100%; margin-top: 10px;">
                                <button type="submit" class="secure-submit btn-primary final-login-btn">
                                    <span class="btn-inner-text">Sign In</span>
                                </button>
                            </div>

                            <div class="auth-switch">
                                <div class="divider-line"><span>OR</span></div>
                                <p>Don't have an account yet? <a href="SignUp.html" class="link-forgot">Sign Up</a></p>
                            </div>
                        </form>
                    </section>

                    <div class="kinetic-divider">
                        <div class="divider-glow-core"></div>
                    </div>

                    <section class="sector sector-right">
                        <div class="welcome-copy">
                            <h3><p style="color: #000; font-weight: bold; margin-bottom: 5px;">Welcome Back To SkillForge!</p>Please log in to your<br><span class="navy">Skill</span><span class="cyan">Forge</span> account.</h3>
                            <p></p>
                        </div>

                        <div class="visual-stage">
                            <img src="../assets/handshake1.png" alt="Handshake" class="handshake-img">
                        </div>
                    </section>

                </main>
            </div>
        </div>

        <footer class="global-footer">
            © 2026 SkillForge AI - ScriptSquad SECURE SIGN IN ACCESS
        </footer>
    </div>
</body>
</html>
